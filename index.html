<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
  
  <title>Frontend Mentor | Contact form</title>
</head>
<body>
  <div class="contact-container">
    <h1>Contact us</h1>
      <form id="contactform" class="contact-form" method="POST" action="C:\Users\alber\Documents\form_db.xlsx">
        <div class="form-group">
        <label for="First Name">First Name *</label>
          <br>
          <input type="Name" id="firstName">
          <label for="Last Name">Last Name *</label>
          <br>
          <input type="Name" id="lastName"> //corrections made to id name: id names should be unique
        </div>
        <div class="form-group">
          <label for="Email Address">Email Address *</label>
          <br>
          <input type="Email" id="Email">
        </div>
        <div class="form-group">
          <label for="Query Type">Query Type * </label>
            <div class="radio-elems">
              <div class="radio-group one">
                <input type="radio" id="radio" name="radio" value="General Query">
                <label for="file-upload"  class="radio-label" id="radio-label-one">General Query</label>  
              </div>
              <div class="radio-group two">
                <input type="radio" id="radio" name="radio" value="Support Request">
                <label for="file-upload"  class="radio-label" id="radio-label-two">Support Request</label>
              </div>
            </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message"></textarea>
        </div>
        <div class="form-group">
          <label for="consent"></label>
          <input type="checkbox" id="checkbox" name="checkbox" value="Support Request">
          I consent to being contacted by the team *
        </div>
        <button type="submit">Submit</button>
  </div>
  </form>
</body>
</html>
